{% extends 'learning_logs/base.html' %}

{% block content %}
<title>topic</title>
<p>Topics</p>
<ul>
  {%for topic in topics%}
    <li>
      <a href="{% url 'learning_logs:topic' topic.id %}">
        {{topic.text}}
      </a>
    </li>
  {% empty %}
  <li>No topics have been added yet.</li>

</ul>
<a href="{% url 'learning_logs:new_topic %}">Add a new topic</a>

  {% endfor %}
{% endblock content %}
